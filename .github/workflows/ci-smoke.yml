name: CI trigger smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish smoke result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web
          printf '# CI smoke test\n\n- Status: **SUCCESS**\n- Run ID: `%s`\n' '${{ github.run_id }}' > web/CI_SMOKE_STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/CI_SMOKE_STATUS.md
          git commit -m 'Record CI smoke status [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
