name: Remove obsolete gl4es dependency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_gl4es_dependency.py'
      - '.github/workflows/remove-gl4es.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch graphics initialization
        run: python3 scripts/remove_gl4es_dependency.py

      - name: Commit source patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/core/graphics/gl_main.cpp; then
            echo 'gl4es dependency already removed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/graphics/gl_main.cpp
          git commit -m 'Use Emscripten WebGL compatibility instead of gl4es'
          git pull --rebase origin main
          git push origin HEAD:main
