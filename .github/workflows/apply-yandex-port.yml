name: Apply Yandex Games Port Patches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_yandex_port.py'
      - '.github/workflows/apply-yandex-port.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source patches
        run: python3 scripts/apply_yandex_port.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cpp src/platform/path.cpp
          git commit -m "Integrate Yandex Games lifecycle and persistent saves"
          git push origin HEAD:main
