name: Diagnose V7 browser stress
on:
  push:
    branches: [fix/mobile-batching-v7]
    paths: ['.github/workflows/diagnose-v7.yml','scripts/diagnose_v7_browser.cjs']
permissions:
  contents: read
  actions: read
concurrency:
  group: astromenace-v7-diagnosis
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v7-browser-comparison-debug
          run-id: 37024443285
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: v7-stress-diagnostic
          run-id: 37026748706
          path: named-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cp named-build/dist/index.js dist/index.js
      - run: |
          set -euo pipefail
          npm install --no-save playwright terser
          npx playwright install --with-deps chromium
          node scripts/diagnose_v7_browser.cjs | tee V7_DIAGNOSTIC.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v7-stress-diagnostic
          path: |
            dist/index.js
            V7_DIAGNOSTIC.txt

