name: Package V7 production from cached assets
on:
  push:
    branches: [fix/mobile-batching-v7]
    paths: ['.github/workflows/diagnose-v7.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: astromenace-v7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: v7-browser-comparison-debug
          run-id: 37030462755
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build gl4es for Emscripten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/emsdk /tmp/gl4es /tmp/gl4es-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

          git init /tmp/gl4es
          git -C /tmp/gl4es remote add origin https://github.com/ptitSeb/gl4es.git
          git -C /tmp/gl4es fetch --depth 1 origin 81547d986798e876de8b434193920b606a72363f
          git -C /tmp/gl4es checkout --detach FETCH_HEAD

          emcmake cmake -S /tmp/gl4es -B /tmp/gl4es-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOX11=ON \
            -DNOEGL=ON \
            -DSTATICLIB=ON \
            -DDEFAULT_ES=2
          cmake --build /tmp/gl4es-build --target GL -j2
          test -s /tmp/gl4es/lib/libGL.a

      - name: Build production without test hooks
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          python3 scripts/enable_gl4es_offline.py
          bash scripts/build_v6_engine.sh
          python3 scripts/apply_v6_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: astromenace-yandexgames-fast-offline
          path: dist/
          compression-level: 9
          retention-days: 90
