name: Verify and release V7 from cached assets
on:
  push:
    branches: [fix/mobile-batching-v7]
    paths: ['.github/workflows/diagnose-v7.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: astromenace-v7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v7-browser-comparison-debug
          run-id: 37030462755
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build gl4es for Emscripten
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/emsdk /tmp/gl4es /tmp/gl4es-build
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          cd /tmp/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          source ./emsdk_env.sh

          git init /tmp/gl4es
          git -C /tmp/gl4es remote add origin https://github.com/ptitSeb/gl4es.git
          git -C /tmp/gl4es fetch --depth 1 origin 81547d986798e876de8b434193920b606a72363f
          git -C /tmp/gl4es checkout --detach FETCH_HEAD

          emcmake cmake -S /tmp/gl4es -B /tmp/gl4es-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOX11=ON \
            -DNOEGL=ON \
            -DSTATICLIB=ON \
            -DDEFAULT_ES=2
          cmake --build /tmp/gl4es-build --target GL -j2
          test -s /tmp/gl4es/lib/libGL.a

      - name: Build candidate and baseline with identical fixtures
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          python3 scripts/enable_gl4es_offline.py
          python3 scripts/instrument_v7_smoke.py
          ASTROMENACE_TEST_FLAGS=-DASTROMENACE_WEB_SMOKE_TEST=1 bash scripts/build_v6_engine.sh
          python3 scripts/apply_v6_runtime.py
          cp -a dist dist-candidate
          files=(src/core/particle_system/particle_system.cpp src/core/particle_system/particle_system.h src/object3d/object3d.cpp src/object3d/explosion/explosion.cpp src/core/graphics/gl_vbo.cpp src/core/graphics/graphics.h src/core/graphics/extensions.h src/core/graphics/extensions.cpp)
          mkdir -p /tmp/candidate-source
          for file in "${files[@]}"; do
            mkdir -p "/tmp/candidate-source/$(dirname "$file")"
            cp "$file" "/tmp/candidate-source/$file"
            git show cb55b7ed0d25354478f6212386006a534c22e330:"$file" > "$file"
          done
          python3 scripts/instrument_v7_smoke.py
          ASTROMENACE_TEST_FLAGS=-DASTROMENACE_WEB_SMOKE_TEST=1 bash scripts/build_v6_engine.sh
          python3 scripts/apply_v6_runtime.py
          rm -rf dist-baseline
          mv dist dist-baseline
          mv dist-candidate dist
          for file in "${files[@]}"; do cp "/tmp/candidate-source/$file" "$file"; done
      - name: Browser checks
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/test_v6_browser.cjs | tee dist/V6_BROWSER_TEST.txt
          node scripts/test_v7_performance.cjs | tee dist/V7_PERFORMANCE_TEST.txt
      - name: Build production without test hooks
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          bash scripts/build_v6_engine.sh
          python3 scripts/apply_v6_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: astromenace-yandexgames-fast-offline
          path: dist/
          compression-level: 9
          retention-days: 90
