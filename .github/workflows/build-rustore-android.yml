name: Build AstroMenace RuStore Android

on:
  workflow_dispatch:
  push:
    branches:
      - rustore-mobile
    paths:
      - 'android-rustore/**'
      - '.github/workflows/build-rustore-android.yml'

permissions:
  contents: read
  actions: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download latest verified offline game artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GAME_DIR="${GITHUB_WORKSPACE}/android-rustore/app/src/main/assets/game"
          rm -rf "${GAME_DIR}"
          mkdir -p "${GAME_DIR}"

          RUN_ID="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow build-web-offline.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          test -n "${RUN_ID}"
          gh run download "${RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name astromenace-yandexgames-fast-offline \
            --dir "${GAME_DIR}"

          test -s "${GAME_DIR}/index.html"
          test -s "${GAME_DIR}/index.js"
          test -s "${GAME_DIR}/gamedata.js"
          echo "Bundled game payload:"
          du -sh "${GAME_DIR}"

      - name: Prepare optional RuStore release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUSTORE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64}" ]]; then
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/astromenace-rustore.jks"
            echo "ASTROMENACE_KEYSTORE_PATH=${RUNNER_TEMP}/astromenace-rustore.jks" >> "${GITHUB_ENV}"
          else
            echo "No release keystore configured: release outputs will remain unsigned; debug APK stays installable."
          fi

      - name: Build APK and AAB
        working-directory: android-rustore
        env:
          ASTROMENACE_KEYSTORE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
          ASTROMENACE_KEY_ALIAS: ${{ secrets.RUSTORE_KEY_ALIAS }}
          ASTROMENACE_KEY_PASSWORD: ${{ secrets.RUSTORE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Verify packaged application does not request INTERNET
        shell: bash
        run: |
          set -euo pipefail
          APK="android-rustore/app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          if "${ANDROID_HOME}/build-tools/36.0.0/aapt" dump permissions "${APK}" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission found in APK" >&2
            exit 1
          fi
          echo "Permission audit: PASS (no INTERNET permission)."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: astromenace-rustore-debug-apk
          path: android-rustore/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release outputs
        uses: actions/upload-artifact@v4
        with:
          name: astromenace-rustore-release
          path: |
            android-rustore/app/build/outputs/apk/release/*.apk
            android-rustore/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
